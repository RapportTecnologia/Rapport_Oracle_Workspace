<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Exemplo Solana — Anchor + CPI</title>
  <desc id="desc">Programa Anchor que consome o oracle via CPI com PDA de estado.</desc>
  <rect width="1200" height="800" fill="#101c30"/>
  <circle cx="1120" cy="60" r="320" fill="#172a44"/>
  <circle cx="40" cy="790" r="260" fill="#14243b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="110" fill="#f5a347" font-size="24" letter-spacing="4">EXEMPLO · ANCHOR/RUST</text>
    <text x="85" y="248" fill="#ffffff" font-size="88" font-weight="700">SOLANA + CPI</text>
    <text x="90" y="310" fill="#c5d3e5" font-size="34">Query via Cross-Program Invocation</text>
    <rect x="90" y="390" width="1020" height="230" rx="18" fill="#172a44" stroke="#67aee8" stroke-width="2"/>
    <g font-family="Consolas, Menlo, monospace" font-size="26">
      <text x="130" y="450" fill="#f5a347">rapport_oracle_sdk::rapport_oracle_query(</text>
      <text x="130" y="500" fill="#ffffff">  cpi_ctx, 0, "URL".to_string(),</text>
      <text x="130" y="545" fill="#a5d6a7">  vec!["json(...).USD".to_string()])?;</text>
      <text x="130" y="600" fill="#7d8aa0">// callback: require_cb_authority(&signer, &cfg)?;</text>
    </g>
    <text x="90" y="687" fill="#ffffff" font-size="29">PDA por query, evento e callback validado.</text>
    <text x="90" y="737" fill="#91aac8" font-size="23">Anchor · PDA · ed25519 · rapport_oracle_sdk</text>
  </g>
</svg>
