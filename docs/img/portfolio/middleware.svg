    </g>
    <text x="90" y="687" fill="#ffffff" font-size="29">Polling de logs · fetch URL · json(url).path</text>
    <text x="90" y="737" fill="#91aac8" font-size="23">Cloudflare Workers · KV state · deduplicação · /health /status</text>
