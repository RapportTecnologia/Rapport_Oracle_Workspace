<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Rapport Oracle — Middleware</title>
  <desc id="desc">Worker Cloudflare que resolve queries do oracle e devolve callbacks assinados on-chain.</desc>
  <rect width="1200" height="800" fill="#101c30"/>
  <circle cx="1120" cy="60" r="320" fill="#172a44"/>
  <circle cx="40" cy="790" r="260" fill="#14243b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="110" fill="#f5a347" font-size="24" letter-spacing="4">RAPPORT ORACLE</text>
    <text x="85" y="248" fill="#ffffff" font-size="96" font-weight="700">MIDDLEWARE</text>
    <text x="90" y="310" fill="#c5d3e5" font-size="34">Worker Cloudflare · Oraclize/Provable</text>
    <g fill="none" stroke="#67aee8" stroke-width="6">
      <path d="M400 495h80m-20-15 20 15-20 15M720 495h80m-20-15 20 15-20 15"/>
    </g>
    <rect x="90" y="400" width="300" height="190" rx="20" fill="#203652" stroke="#67aee8" stroke-width="2"/>
    <rect x="490" y="400" width="220" height="190" rx="20" fill="#f5a347"/>
    <rect x="810" y="400" width="300" height="190" rx="20" fill="#203652" stroke="#67aee8" stroke-width="2"/>
    <g text-anchor="middle">
      <g fill="#c5d3e5" font-size="21" letter-spacing="3">
        <text x="240" y="449">EVENTOS</text>
        <text x="960" y="449">CALLBACK</text>
      </g>
      <text x="600" y="449" fill="#172238" font-size="21" letter-spacing="3">CRON 1 MIN</text>
      <g font-size="44" font-weight="700">
        <text x="240" y="530" fill="#ffffff">on-chain</text>
        <text x="600" y="530" fill="#172238">Worker</text>
        <text x="960" y="530" fill="#ffffff">proof</text>
      </g>
      <g font-size="18">
        <text x="240" y="568" fill="#91aac8">eth_getLogs · getEvents</text>
