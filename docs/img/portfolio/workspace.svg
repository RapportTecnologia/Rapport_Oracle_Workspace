<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Rapport Oracle — Workspace</title>
  <desc id="desc">Workspace raiz que integra os submódulos middleware e smartcontracts.</desc>
  <rect width="1200" height="800" fill="#101c30"/>
  <circle cx="1120" cy="60" r="320" fill="#172a44"/>
  <circle cx="40" cy="790" r="260" fill="#14243b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="110" fill="#f5a347" font-size="24" letter-spacing="4">RAPPORT ORACLE</text>
    <text x="85" y="248" fill="#ffffff" font-size="96" font-weight="700">WORKSPACE</text>
    <text x="90" y="310" fill="#c5d3e5" font-size="34">Repositório raiz · Git submodules</text>
    <g fill="none" stroke="#67aee8" stroke-width="6">
      <path d="M600 405v-60"/>
      <path d="M330 495h-60m15-15-15 15 15 15M870 495h60m-15-15 15 15-15 15" stroke-dasharray="1 0"/>
